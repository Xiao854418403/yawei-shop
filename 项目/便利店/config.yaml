# ============================================================
# 便利店在线商城 - 配置文件
# ============================================================

store:
  name: "亚伟便利店_24小时"
  subtitle: "精选零食 · 烟酒 · 槟榔 · 日用"
  phone: "18976358922"
  delivery_note: "满30元配送到家 · 下单即送 · 品质保证"

# 配送规则
delivery:
  min_amount: 30           # 满多少元才配送
  free_amount: 30           # 满多少元免配送费
  pickup_only_below: true   # 不足最低金额只能自提
  remote_areas:             # 偏远地区不支持配送
    - "新疆"
    - "西藏"
    - "内蒙古"
    - "青海"
    - "甘肃"

# 管理员密码（本地开发用，云端请用 st.secrets）
admin:
  password: "admin123"

# 店员密码（云端用 st.secrets: STAFF_PASSWORD）
staff:
  password: "staff123"

# 商品品类
categories:
  - 零食
  - 饮料
  - 烟
  - 酒
  - 槟榔
  - 日用品

# 订单状态
order_statuses:
  - 待确认
  - 已确认
  - 配送中
  - 已送达
  - 已取消
